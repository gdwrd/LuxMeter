name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Run unit tests, lint and build APKs
        run: >-
          ./gradlew --no-daemon --console=plain --max-workers=2
          :app:testDebugUnitTest :app:lintDebug
          :app:assembleDebug :app:assembleDebugAndroidTest
          :app:lintRelease :app:assembleRelease

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android UI and release startup tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            ./gradlew --no-daemon --console=plain --max-workers=2 :app:connectedDebugAndroidTest
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --alignment-preserved true --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/release-smoke.apk" app/build/outputs/apk/release/app-release-unsigned.apk
            adb install --no-incremental -r "$RUNNER_TEMP/release-smoke.apk"
            adb logcat -c
            adb shell am start -W -n com.nsheremet.luxmeter/com.example.MainActivity > "$RUNNER_TEMP/release-smoke-start.txt"
            cat "$RUNNER_TEMP/release-smoke-start.txt"
            grep -q 'Status: ok' "$RUNNER_TEMP/release-smoke-start.txt"
            sleep 5
            adb logcat -b crash -d > "$RUNNER_TEMP/release-smoke-crashes.txt"
            if grep -Eq 'Process: com\.nsheremet\.luxmeter,|>>> com\.nsheremet\.luxmeter <<<' "$RUNNER_TEMP/release-smoke-crashes.txt"; then cat "$RUNNER_TEMP/release-smoke-crashes.txt"; exit 1; fi
            adb shell pidof com.nsheremet.luxmeter

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/release-smoke-start.txt
            ${{ runner.temp }}/release-smoke-crashes.txt
          retention-days: 14

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: luxmeter-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

  publish-release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: test-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          : "${KEYSTORE_BASE64:?Configure the KEYSTORE_BASE64 repository secret}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luxmeter-release.p12"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/luxmeter-release.p12
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${STORE_PASSWORD:?Configure the STORE_PASSWORD repository secret}"
          : "${KEY_PASSWORD:?Configure the KEY_PASSWORD repository secret}"
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a vX.Y.Z version tag.' >&2; exit 1; }
          env -u KEYSTORE_PATH ./gradlew --no-daemon --console=plain --max-workers=2 \
            --no-configuration-cache :app:lintRelease :app:assembleRelease
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          assert metadata['applicationId'] == 'com.nsheremet.luxmeter', metadata
          assert len(metadata['elements']) == 1, metadata
          apk = metadata['elements'][0]
          assert apk['versionName'] == os.environ['TAG_NAME'][1:], 'Tag must match the app versionName.'
          assert 1 <= apk['versionCode'] <= 2100000000, 'Invalid versionCode.'
          PYTHON
          # Preserve ZIP alignment so F-Droid can reproduce the APK and copy its signature.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --alignment-preserved true \
            --ks "$KEYSTORE_PATH" --ks-key-alias upload \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET_TAG="${TAG_NAME//[^a-zA-Z0-9._-]/_}"
          APK="$RUNNER_TEMP/LuxMeter-${ASSET_TAG:0:180}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          if DRAFT=$(gh release view --json isDraft --jq '.isDraft' -- "$TAG_NAME" 2>/dev/null); then
            if [[ "$DRAFT" == "true" ]]; then
              gh release upload --clobber -- "$TAG_NAME" "$APK"
              gh release edit --draft=false -- "$TAG_NAME"
            else
              echo "Release already published; keeping its existing APK."
            fi
          else
            gh release create --verify-tag --generate-notes --title "$TAG_NAME" -- "$TAG_NAME" "$APK"
          fi

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/luxmeter-release.p12"
